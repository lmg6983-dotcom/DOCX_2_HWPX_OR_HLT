# 윈도 실행 파일 빌드: CLI(docx2hwpx-hlt.exe) + 화면 앱(docx2hwpx-hlt-gui.exe)
# + 설치 파일(docx2hwpx-hlt-setup-x64.exe, Inno Setup — installer/docx2hwpx-hlt.iss).
# 결과는 Actions 실행 화면의 Artifacts 에서 받는다.
# v* 태그를 올리거나, 수동 실행(workflow_dispatch)에서 release 에 v0.1.0 같은 이름을 넣으면
# 같은 zip 을 붙인 GitHub 릴리스도 만든다(수동 실행이면 그 커밋에 태그도 만든다).
# 릴리스 노트는 .github/release-notes.md 뒤에 PR 목록(분류는 .github/release.yml)을 붙인다.
# 릴리스 때 SIGNPATH_API_TOKEN 비밀값이 있으면 SignPath 로 exe 에 코드 서명을 한다
# (설정은 CODE_SIGNING.md). 없으면 서명 없이 예전처럼 낸다.
name: windows

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "릴리스 태그(예: v0.1.0). 비우면 빌드만 한다"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read # SignPath 가 서명할 Artifact 를 내려받는다
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v') }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 윈도에서도 변환 · JSON 계약 · --overwrite(파일 바꿔 넣기)를 확인한다.
      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked --features gui --bins

      - name: Collect exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force exe | Out-Null
          Copy-Item target/release/docx2hwpx-hlt-gui.exe, target/release/docx2hwpx-hlt.exe exe/

      # 서명은 릴리스 때만(SignPath Foundation 은 서명마다 사람이 승인한다).
      - name: Upload unsigned exe
        id: unsigned
        if: env.IS_RELEASE == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: exe/

      - name: Sign (SignPath)
        if: env.IS_RELEASE == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || github.event.repository.name }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use signed exe
        if: env.IS_RELEASE == 'true' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item -Force signed/*.exe exe/
          Get-ChildItem exe/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0}: {1} ({2})" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { throw "서명이 올바르지 않다: $($_.Name)" }
          }

      # 화면 앱 zip(일반 사용자용, 이름 그대로 — 기존 다운로드 링크 유지)과 명령줄 zip 을 따로 낸다.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force gui, cli | Out-Null
          Copy-Item exe/docx2hwpx-hlt-gui.exe, README.md, LICENSE gui/
          Copy-Item exe/docx2hwpx-hlt.exe, README.md, AGENTS.md, LICENSE cli/
          Compress-Archive -CompressionLevel Optimal -Path gui/* -DestinationPath docx2hwpx-hlt-windows-x64.zip
          Compress-Archive -CompressionLevel Optimal -Path cli/* -DestinationPath docx2hwpx-hlt-cli-windows-x64.zip
          Get-ChildItem exe/*.exe, *.zip | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # 설치 파일: (서명했으면 서명된) exe/ 를 담는다. 러너에 Inno Setup 6 이 없으면 choco 로 깔고,
      # 한국어 메시지 파일이 없으면 Inno Setup 공식 저장소에서 받는다.
      - name: Installer
        shell: pwsh
        run: |
          # PATH 의 iscc 는 Chocolatey 바로가기(…\Chocolatey\bin)라 Languages 폴더가 없다 — 실제 설치 폴더의 ISCC.exe 를 쓴다.
          $find = { @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = & $find
          }
          if (-not $iscc) { throw "Inno Setup 6(ISCC.exe)을 찾지 못했다" }
          "ISCC: $iscc"
          $lang = Join-Path (Split-Path $iscc) "Languages\Korean.isl"
          if (-not (Test-Path $lang)) {
            $base = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages"
            foreach ($uri in "$base/Korean.isl", "$base/Unofficial/Korean.isl") {
              try { Invoke-WebRequest -UseBasicParsing -OutFile $lang -Uri $uri; break } catch { "못 받음: $uri" }
            }
            if (-not (Test-Path $lang)) { throw "Korean.isl 을 받지 못했다" }
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          & $iscc /Qp "/DAppVersion=$version" "/DBinDir=..\exe" installer\docx2hwpx-hlt.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\docx2hwpx-hlt-setup-x64.exe .
          "docx2hwpx-hlt-setup-x64.exe  {0:N1} MB" -f ((Get-Item docx2hwpx-hlt-setup-x64.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: docx2hwpx-hlt-windows-x64
          path: |
            docx2hwpx-hlt-setup-x64.exe
            docx2hwpx-hlt-windows-x64.zip
            docx2hwpx-hlt-cli-windows-x64.zip

      - name: Release
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
        run: >
          gh release create "$env:TAG" docx2hwpx-hlt-setup-x64.exe docx2hwpx-hlt-windows-x64.zip docx2hwpx-hlt-cli-windows-x64.zip
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "DOCX_2_HWPX_OR_HLT $env:TAG"
          --notes-file .github/release-notes.md
          --generate-notes
